name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      # network-as-code declares an unused pip==25.3 runtime dependency. Keep
      # the build tool patched before its own advisory check (see requirements-dev.txt).
      - run: python -m pip install --upgrade 'pip>=26.2'
      - run: python scripts/verify_runtime_lock.py
      - run: ISNAD_DATABASE_URL=sqlite:// python -m alembic upgrade head
      - run: python -m ruff check app tests scripts demo
      - run: python -m pytest -q
      - run: python -m pip_audit --skip-editable
      - run: docker build -t isnad:ci .
