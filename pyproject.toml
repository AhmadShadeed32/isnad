[project]
name = "isnad"
version = "0.1.0"
description = "Isnad — an agentic network-verified trust engine (CAMARA / Nokia Network-as-Code)"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
# Real network provider (needs Nokia NaC sandbox credentials):
#   pip install network-as-code
nac = ["network-as-code>=8.0"]
# Optional LLM planner (ISNAD_PLANNER=llm):
llm = ["anthropic>=0.40"]
# Optional Redis cache backend (ISNAD_CACHE_BACKEND=redis):
redis = ["redis>=5.0"]
# Postgres driver (set ISNAD_DATABASE_URL=postgresql+psycopg://...):
postgres = ["psycopg[binary]>=3.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "demo*"]
