<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isnad — what we keep</title>
<!--
  The answer to "you HMAC subscriber numbers and query their location — which
  regulator permits that?" Every number on this page is fetched from
  /v1/privacy/posture rather than written here, because a hard-coded retention
  window becomes a lie the first time somebody tunes it.

  Zero external origins, like receipt.html and console.html.
-->
<style>
  :root{--bg:#0d1117;--fg:#e6edf3;--mut:#8b949e;--green:#3fb950;--amber:#d29922;
        --line:#30363d;--card:#161b22}
  *{box-sizing:border-box}
  body{margin:0;padding:1.4rem;background:var(--bg);color:var(--fg);
       font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  main{max-width:720px;margin:0 auto}
  h1{font-size:1.35rem;margin:0 0 .3rem}
  .sub{color:var(--mut);margin:0 0 1.6rem}
  h2{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;
     color:var(--amber);margin:1.8rem 0 .7rem;font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;
        padding:.9rem 1rem;margin-bottom:.6rem}
  .kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:.4rem 1rem}
  .k{color:var(--mut)}
  .yes{color:var(--green)}
  .no{color:var(--mut);text-decoration:line-through}
  .why{color:var(--mut);margin:.45rem 0 0;font-size:13px}
  ul{margin:0;padding-left:1.1rem}
  li{margin-bottom:.5rem;color:var(--mut)}
  .win{font-size:1.5rem;color:var(--green)}
  code{color:var(--amber)}
  .err{color:var(--amber)}
</style>

<main>
  <h1>What this system keeps</h1>
  <p class="sub">Read live from this deployment, not written down here.
    Source: <code>/v1/privacy/posture</code></p>

  <div id="out"><p class="sub">Loading…</p></div>
</main>

<script>
const out = document.getElementById('out');

function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;   // never innerHTML: S10
  return n;
}

function section(title){ out.appendChild(el('h2', null, title)); }

function card(){ const c = el('div','card'); out.appendChild(c); return c; }

function kv(parent, k, v, cls){
  const grid = el('div','kv');
  grid.appendChild(el('span','k',k));
  grid.appendChild(el('span', cls || null, v));
  parent.appendChild(grid);
}

fetch('/v1/privacy/posture').then(r => r.json()).then(d => {
  out.textContent = '';

  section('The subject');
  const s = card();
  kv(s, 'binding', d.subject_binding.method);
  kv(s, 'stored', d.subject_binding.stored, 'yes');
  kv(s, 'not stored', d.subject_binding.not_stored, 'no');

  section('The evidence');
  const e = card();
  kv(e, 'normalized', d.evidence.normalized);
  kv(e, 'consent', d.evidence.consent_recorded_per_link
      ? 'recorded on every link, inside the signed bytes' : 'not recorded', 'yes');
  kv(e, 'bases in use', d.evidence.consent_bases_in_use.join(' · '));

  section('Retention');
  d.retention.forEach(w => {
    const c = card();
    kv(c, w.name, '');
    c.appendChild(el('div','win', w.human));
    c.appendChild(el('p','why', w.why));
  });
  const sw = card();
  kv(sw, 'sweeper', d.sweeper.enabled
      ? 'running every ' + d.sweeper.interval_seconds + 's' : 'DISABLED',
      d.sweeper.enabled ? 'yes' : 'err');
  sw.appendChild(el('p','why', d.sweeper.note));

  section('What this page is not');
  const l = card(); const ul = el('ul');
  d.limits.forEach(t => ul.appendChild(el('li', null, t)));
  l.appendChild(ul);
}).catch(() => {
  out.textContent = '';
  out.appendChild(el('p','err','Could not read the posture endpoint.'));
});
</script>

<script src="/ui/i18n.js" defer></script>
